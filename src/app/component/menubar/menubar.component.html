<mat-drawer-container autosize>
    <mat-drawer #drawer [opened]="!isMobile" [mode]="isMobile ? 'over' : 'side'" position="start">
    <mat-nav-list>

        <mat-list-item>
            <button routerLink="" mat-button (click)="isMobile && drawer.close()"><mat-icon>home</mat-icon> Home</button>
        </mat-list-item>
        <mat-list-item>
          <button routerLink="player" mat-button (click)="isMobile && drawer.close()"><mat-icon>person_search</mat-icon> Players Profile</button>
        </mat-list-item>
        <mat-list-item>
            <button routerLink="gameplan" mat-button (click)="isMobile && drawer.close()"><mat-icon>calendar_month</mat-icon> Plan a Game</button>
        </mat-list-item>
        <mat-list-item>
            <button routerLink="gamerecord" mat-button (click)="isMobile && drawer.close()"><mat-icon>scoreboard</mat-icon> Record a Games</button>
        </mat-list-item>

        <mat-list-item>
            <button routerLink="statistics" mat-button (click)="isMobile && drawer.close()"><mat-icon>insights</mat-icon> Statistics & Analytics</button>
        </mat-list-item>
        <mat-list-item>
            <button routerLink="photos" mat-button (click)="isMobile && drawer.close()"><mat-icon>now_wallpaper</mat-icon> Photos</button>
        </mat-list-item>
        <mat-list-item>
          <button routerLink="donation" mat-button (click)="isMobile && drawer.close()"><mat-icon>attach_money</mat-icon> Donation</button>
        </mat-list-item>
        <mat-list-item>
            <button routerLink="gamerule" mat-button (click)="isMobile && drawer.close()"><mat-icon>menu_book</mat-icon> Game rules</button>
        </mat-list-item>
        <mat-list-item>
            <button routerLink="aboutus" mat-button (click)="isMobile && drawer.close()"><mat-icon>help</mat-icon> About Us</button>
        </mat-list-item>
        <mat-list-item *ngIf="isMobile">
            <a href="/oauth2/authorization/cognito" mat-button><mat-icon>login</mat-icon> Sign in</a>
        </mat-list-item>

    </mat-nav-list>
    </mat-drawer>
    <mat-drawer-content>
        <div class="main-content">
            <router-outlet></router-outlet>
        </div>
    </mat-drawer-content>
</mat-drawer-container>

<mat-toolbar>
    <mat-toolbar-row>
      <span class="footer-text">© Copyright - The New Jersey Princeton Golf Club 2025.</span>
    </mat-toolbar-row>
</mat-toolbar>
