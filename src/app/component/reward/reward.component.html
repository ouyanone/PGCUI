<div class="reward-page">

  <div class="page-header">
    <div class="page-header-text">
      <h2 class="page-title">Awards &amp; Rewards</h2>
      <p class="page-subtitle">Manage PGC game awards grouped by event</p>
    </div>
    <button mat-raised-button color="primary" (click)="openAddDialog()" class="add-btn" *ngIf="isLoggedIn">
      <mat-icon>add</mat-icon> Add Award
    </button>
  </div>

  <div class="grid-wrap">
    <ag-grid-angular
      class="ag-theme-quartz pgc-grid"
      domLayout="autoHeight"
      [defaultColDef]="defaultColDef"
      [autoGroupColumnDef]="autoGroupColDef"
      [rowData]="rewards"
      [columnDefs]="colDefs"
      [groupDisplayType]="'groupRows'"
      [pagination]="true"
      [paginationPageSize]="50"
      (gridReady)="onGridReady($event)"
      (cellClicked)="onCellClicked($event)">
    </ag-grid-angular>
  </div>

</div>
