<div *ngIf="editdata">

  <div class="flex-container" *ngFor="let tee of editdata.teeList; let i = index">
    <mat-card class="example-card">
      <mat-card-header>
        <div mat-card-avatar class="example-header-image"></div>
        <mat-card-title>Tee # {{tee.teeName}}</mat-card-title>
        <mat-card-subtitle>Event Date: {{editdata.eventDate}}</mat-card-subtitle>
        <mat-card-subtitle>Tee Time: {{tee.teeTime}}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <mat-grid-list cols="2" rowHeight="280px">
          <mat-grid-tile
            *ngFor="let ps of tee.playerScoreList; let j = index"
            [style.background-color]="j % 2 === 0 ? 'SeaShell' : 'LightCyan'">
            <div *ngIf="ps && ps.player" style="padding: 12px; width: 100%;">
              <div class="user" style="background-image: url('../../../assets/{{ps.player.fName}}_{{ps.player.lName}}.jpg');
                   width: 60px; height: 60px; background-size: cover; border-radius: 50%; margin: 0 auto 8px;">
              </div>
              <h4 class="groupuser">{{ps.player.fName}} {{ps.player.lName}}</h4>
              <h4 class="groupuser">{{ps.player.chineseNickName}}</h4>
              <h5 class="groupuser">Handicap: {{ps.player.handicap}}</h5>
              <h5 class="groupuser">PGC Handicap: {{ps.entryPGCHandicap}}</h5>
              <h5 class="groupuser">Last 3 Avg: {{ps.entryScore}}</h5>
              <div style="display:flex; flex-direction: row; align-items: center; margin-top: 8px;">
                <h5 class="groupuser" style="margin: 0 8px 0 0;">Score:</h5>
                <input type="number" size="6" maxlength="6" [(ngModel)]="ps.score" style="width: 60px;">
              </div>
            </div>
          </mat-grid-tile>
        </mat-grid-list>
      </mat-card-content>
    </mat-card>
  </div>

  <div style="display:flex; gap: 8px; margin-top: 16px;">
    <button type="button" mat-raised-button color="warn"
            (click)="deleteEvent()"
            *ngIf="editdata.status === 'OPEN' || editdata.status === 'INIT'">
      Delete Event
    </button>
    <button type="button" mat-raised-button color="primary"
            (click)="onSubmitScore()"
            *ngIf="editdata.status === 'OPEN' || editdata.status === 'INIT'">
      Submit Score
    </button>
    <button type="button" mat-raised-button (click)="closepopup()">Close</button>
  </div>

</div>
