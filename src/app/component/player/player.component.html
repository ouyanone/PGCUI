<div class="player-page">

  <!-- ── Page header ── -->
  <div class="page-header">
    <div class="page-header-text">
      <h2 class="page-title">Players Profile</h2>
      <p class="page-subtitle">Active PGC members</p>
    </div>
    <div class="page-actions">
      <button mat-raised-button color="primary" type="button" (click)="onGhinSyncClick()">
        <mat-icon>sync</mat-icon>
        <span class="btn-label">GHIN Sync</span>
      </button>
      <button mat-raised-button color="accent" type="button" (click)="onAddUserClick()">
        <mat-icon>person_add</mat-icon>
        <span class="btn-label">Add Player</span>
      </button>
    </div>
  </div>

  <!-- ── AG Grid (scrollable on mobile) ── -->
  <div class="grid-wrap">
    <ag-grid-angular
      class="ag-theme-quartz pgc-grid"
      domLayout="autoHeight"
      [defaultColDef]="defaultColDef"
      [rowData]="players"
      [columnDefs]="colDefs"
      [pagination]="true"
      [paginationPageSize]="25"
      [rowStyle]="{ cursor: 'pointer' }"
      (gridReady)="onGridReady($event)"
      (rowClicked)="onRowClicked($event)">
    </ag-grid-angular>
  </div>

</div>
