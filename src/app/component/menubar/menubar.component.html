<mat-toolbar color="primary" class="mat-elevation-z8" style="background: linear-gradient(135deg, #1a3c5e 0%, #234d76 100%); color: #fff;">
    <button (click)="drawer.toggle()" mat-icon-button aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
    </button>
    <img class="toolbar-logo" src="/assets/pgc-logo.jpeg" alt="PGC Logo" />
    <span class="toolbar-title">普林斯顿高尔夫俱乐部 &nbsp;|&nbsp; New Jersey Princeton Golf Club</span>
    <span class="example-spacer"></span>
    <div class="toolbar-actions">
        <a href="mailto:yanouone@gmail.com?subject=Request to join Ten Dollar Club"
           mat-stroked-button class="join-btn">
            <mat-icon style="font-size:16px;height:16px;width:16px;vertical-align:middle;">golf_course</mat-icon>
            &nbsp;Join Us
        </a>
        <a *ngIf="!isMobile" href="/oauth2/authorization/cognito"
           mat-stroked-button class="signin-btn">
            <mat-icon style="font-size:16px;height:16px;width:16px;vertical-align:middle;">login</mat-icon>
            &nbsp;Sign In
        </a>
    </div>
</mat-toolbar>

<mat-drawer-container autosize>
    <mat-drawer #drawer class="pgc-drawer"
                [opened]="!isMobile"
                [mode]="isMobile ? 'over' : 'side'"
                position="start">

        <!-- Drawer header -->
        <div class="drawer-header">
            <img class="drawer-logo" src="/assets/pgc-logo.jpeg" alt="PGC Logo" />
            <div class="drawer-club-name">普林斯顿高尔夫俱乐部<br>Princeton Golf Club</div>
        </div>

        <!-- Nav items -->
        <mat-nav-list class="drawer-nav" disableRipple>
            <mat-list-item>
                <button mat-button class="nav-item-btn" routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="isMobile && drawer.close()">
                    <mat-icon>home</mat-icon> Home
                </button>
            </mat-list-item>
            <mat-list-item>
                <button mat-button class="nav-item-btn" routerLink="player" routerLinkActive="active" (click)="isMobile && drawer.close()">
                    <mat-icon>person_search</mat-icon> Players Profile
                </button>
            </mat-list-item>
            <mat-list-item>
                <button mat-button class="nav-item-btn" routerLink="gameplan" routerLinkActive="active" (click)="isMobile && drawer.close()">
                    <mat-icon>calendar_month</mat-icon> Plan a Game
                </button>
            </mat-list-item>
            <mat-list-item>
                <button mat-button class="nav-item-btn" routerLink="gamerecord" routerLinkActive="active" (click)="isMobile && drawer.close()">
                    <mat-icon>scoreboard</mat-icon> Game Records
                </button>
            </mat-list-item>
            <mat-list-item>
                <button mat-button class="nav-item-btn" routerLink="statistics" routerLinkActive="active" (click)="isMobile && drawer.close()">
                    <mat-icon>insights</mat-icon> Statistics
                </button>
            </mat-list-item>
            <mat-list-item>
                <button mat-button class="nav-item-btn" routerLink="photos" routerLinkActive="active" (click)="isMobile && drawer.close()">
                    <mat-icon>photo_library</mat-icon> Photos
                </button>
            </mat-list-item>
            <mat-list-item>
                <button mat-button class="nav-item-btn" routerLink="donation" routerLinkActive="active" (click)="isMobile && drawer.close()">
                    <mat-icon>volunteer_activism</mat-icon> Donation
                </button>
            </mat-list-item>
            <mat-list-item>
                <button mat-button class="nav-item-btn" routerLink="gamerule" routerLinkActive="active" (click)="isMobile && drawer.close()">
                    <mat-icon>menu_book</mat-icon> Game Rules
                </button>
            </mat-list-item>
            <mat-list-item>
                <button mat-button class="nav-item-btn" routerLink="aboutus" routerLinkActive="active" (click)="isMobile && drawer.close()">
                    <mat-icon>info</mat-icon> About Us
                </button>
            </mat-list-item>
            <mat-divider style="margin:8px 0;"></mat-divider>
            <mat-list-item *ngIf="isMobile">
                <a mat-button class="nav-item-btn" href="/oauth2/authorization/cognito">
                    <mat-icon>login</mat-icon> Sign In
                </a>
            </mat-list-item>
        </mat-nav-list>
    </mat-drawer>

    <mat-drawer-content>
        <div class="main-content">
            <router-outlet></router-outlet>
        </div>
    </mat-drawer-content>
</mat-drawer-container>

<mat-toolbar class="pgc-footer">
    <mat-toolbar-row>
        <span class="footer-text">© 2025 The New Jersey Princeton Golf Club &nbsp;·&nbsp; 新泽西普林斯顿高尔夫俱乐部</span>
    </mat-toolbar-row>
</mat-toolbar>
