<div class="pgc-page donation-page">

  <div class="page-header">
    <mat-icon class="page-icon">volunteer_activism</mat-icon>
    <h1 class="pgc-section-title">Club Donations</h1>
    <p class="page-subtitle">$10 Club — Member Contribution Records</p>
  </div>

  <div class="grid-wrapper">
    <ag-grid-angular
      class="ag-theme-quartz"
      style="height: 65vh; width: 100%"
      [defaultColDef]="defaultColDef"
      [rowData]="donations"
      [columnDefs]="colDefs"
      (gridReady)="onGridReady($event)"
      [pagination]="true">
    </ag-grid-angular>
  </div>

</div>
