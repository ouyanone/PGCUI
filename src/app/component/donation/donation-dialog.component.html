<h2 mat-dialog-title>{{ isEdit ? 'Edit Donation' : 'Add Donation' }}</h2>

<mat-dialog-content [formGroup]="form" class="donation-form">

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Donation Name</mat-label>
    <input matInput formControlName="donationName" placeholder="e.g. 2025 Spring Donation">
    <mat-error *ngIf="form.get('donationName')?.hasError('required')">
      Donation name is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <textarea matInput formControlName="donationDesc" rows="3"
              placeholder="Optional description"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Donation Date</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="donationDate">
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Amount ($)</mat-label>
    <input matInput type="number" formControlName="amount" placeholder="0.00" min="0" step="0.01">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Player (optional)</mat-label>
    <mat-select formControlName="playerId">
      <mat-option [value]="null">— None —</mat-option>
      <mat-option *ngFor="let p of players" [value]="p.id">
        {{ playerLabel(p) }}
      </mat-option>
    </mat-select>
  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end" style="padding: 8px 24px 16px; gap: 8px;">
  <button mat-stroked-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
    {{ isEdit ? 'Save Changes' : 'Add Donation' }}
  </button>
</mat-dialog-actions>
