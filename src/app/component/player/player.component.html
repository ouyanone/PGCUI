<div class="player-page">

  <!-- ── Page header ── -->
  <div class="page-header">
    <div class="page-header-text">
      <h2 class="page-title">Players Profile</h2>
      <p class="page-subtitle">{{ players.length }} {{ view === 'member' ? 'PGC member' : view === 'active' ? 'active player' : 'player' }}{{ players.length === 1 ? '' : 's' }}</p>
    </div>
    <div class="page-actions">
      <button mat-raised-button color="primary" type="button" (click)="onGhinSyncClick()">
        <mat-icon>sync</mat-icon>
        <span class="btn-label">GHIN Sync</span>
      </button>
      <button mat-raised-button color="accent" type="button" (click)="onAddUserClick()">
        <mat-icon>person_add</mat-icon>
        <span class="btn-label">Add Player</span>
      </button>
    </div>
  </div>

  <!-- ── Who to show ── -->
  <div class="view-toggle">
    <button type="button" class="seg" [class.on]="view === 'member'" (click)="setView('member')"
            [attr.aria-pressed]="view === 'member'">
      PGC Members <span class="seg-count">{{ countFor('member') }}</span>
    </button>
    <button type="button" class="seg" [class.on]="view === 'active'" (click)="setView('active')"
            [attr.aria-pressed]="view === 'active'">
      Active <span class="seg-count">{{ countFor('active') }}</span>
    </button>
    <button type="button" class="seg" [class.on]="view === 'all'" (click)="setView('all')"
            [attr.aria-pressed]="view === 'all'">
      All <span class="seg-count">{{ countFor('all') }}</span>
    </button>
  </div>

  <!-- ── AG Grid (scrollable on mobile) ── -->
  <div class="grid-wrap">
    <ag-grid-angular
      class="ag-theme-quartz pgc-grid"
      domLayout="autoHeight"
      [defaultColDef]="defaultColDef"
      [rowData]="players"
      [columnDefs]="colDefs"
      [pagination]="true"
      [paginationPageSize]="25"
      [rowStyle]="{ cursor: 'pointer' }"
      (gridReady)="onGridReady($event)"
      (rowClicked)="onRowClicked($event)">
    </ag-grid-angular>
  </div>

</div>
